/* Consistent, explicit contrast for every month option. */
.month-chip{background:#294ab6;color:#fff;border-color:#294ab6;font-weight:700;box-shadow:0 3px 9px #294ab61a}
.month-chip:hover:not(:disabled){background:#203e9e;border-color:#203e9e}
.month-chip[aria-pressed=true]{background:#294ab6;color:#fff;border-color:#294ab6;box-shadow:0 0 0 3px #a8c3fb}
.month-chip:disabled{opacity:1!important;color:#fff;background:#294ab6;border-color:#294ab6;cursor:not-allowed;box-shadow:none}
.sh-wind path{animation-duration:23s}.sh-wind path:nth-child(2n){stroke:#a7d4ca;animation-direction:reverse;animation-duration:25s}.sh-wind path:nth-child(3n){stroke:#a8caed;animation-duration:21s}

body:not(.has-month) .schedule-hero{padding-top:max(50px,calc(50svh - 115px))!important}
#sh-stage,#sh-open,#sh-message{transition:opacity .3s ease,transform .3s ease}
.summary-leaving #sh-stage,.summary-leaving #sh-open,.summary-leaving #sh-message{opacity:0;transform:translateY(18px);pointer-events:none}

.sh-stage{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;overscroll-behavior-x:contain;scrollbar-width:thin;gap:26px;padding:6px 2px 18px;max-width:1080px}
.sh-card{flex:0 0 calc((100% - 52px)/3);min-width:0;scroll-snap-align:start}
.sh-card.pjp{--accent:#28778a;--tint:#eaf5f6}.pjp-summary{margin-top:10px}.pjp-summary-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf2fa;font-size:11px;color:#7083a2;font-weight:700}.pjp-summary-row strong{color:var(--accent)}.pjp-unavailable{font-size:11px;line-height:1.8;text-align:center;color:#8296b5;margin-top:16px}.pjp-quality{font-size:10px;color:#9a742d;margin-top:12px}
.sh-carousel-nav{max-width:1080px;display:flex;justify-content:flex-end;gap:8px;margin:12px auto -20px;position:relative;z-index:2}.sh-carousel-nav[hidden]{display:none}.sh-carousel-nav button{width:34px;height:34px;border:0;border-radius:50%;background:#254abd;color:#fff;font-size:18px}.summary-leaving .sh-carousel-nav{opacity:0;transition:opacity .3s}
@media(max-width:900px){.sh-stage{gap:18px}.sh-card{flex-basis:calc((100% - 18px)/2)}}
@media(max-width:760px){.sh-stage{max-width:390px;gap:18px}.sh-card{flex-basis:100%}.sh-carousel-nav{max-width:390px}}
@media(prefers-reduced-motion:reduce){.sh-stage{scroll-behavior:auto}}
</style><style id="tracker-export-style">
#tracker-export-button{position:fixed;top:max(16px,env(safe-area-inset-top));right:max(18px,env(safe-area-inset-right));z-index:20;display:grid;place-items:center;width:38px;height:38px;padding:9px;border:1px solid #cdddf1;border-radius:11px;background:#f8fbffed;color:#436b9e;box-shadow:0 3px 12px #254abd08;transition:color .2s,background .2s,border-color .2s}
#tracker-export-button:hover:not(:disabled){color:#254abd;background:#eaf2ff;border-color:#9db8e2}
#tracker-export-button:focus-visible{outline:3px solid #86b2f0;outline-offset:3px}
#tracker-export-button:disabled{opacity:.55;cursor:wait}
#tracker-export-button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#tracker-export-status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:760px){#tracker-export-button{top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));width:36px;height:36px}}
@media(prefers-reduced-motion:reduce){#tracker-export-button{transition:none}}
#tracker-export-dialog{width:370px;max-width:calc(100vw - 32px);padding:25px;border:1px solid #dce6f5;border-radius:18px;background:#f8fbff;color:#17345b;box-shadow:0 22px 65px #17345b2e;font-family:Inter,Arial,sans-serif}
#tracker-export-dialog::backdrop{background:#1023436b;backdrop-filter:blur(3px)}
#tracker-export-dialog h2{margin:0 0 8px;font-size:18px;font-weight:700}
#tracker-export-hint{margin:0 0 21px;color:#7083a2;font-size:12px;line-height:1.7}
#tracker-export-dialog label{display:block;margin-bottom:8px;font-size:12px;font-weight:600}
#tracker-export-password{width:100%;min-height:42px;padding:10px 12px;border:1px solid #c8d8ee;border-radius:9px;background:#fff;color:#17345b;font:inherit;font-size:14px;outline-offset:2px}
#tracker-export-password:focus-visible{outline:2px solid #86b2f0}
#tracker-export-error{min-height:18px;margin:10px 0 15px;font-size:12px;line-height:1.6;color:#b53748;overflow-wrap:anywhere}
.tracker-export-actions{display:flex;justify-content:flex-end;gap:9px}
.tracker-export-actions button{min-height:39px;padding:9px 16px;border-radius:9px;border:1px solid #cedbef;font-size:12px;font-weight:600}
#tracker-export-cancel{background:#fff;color:#567090}
#tracker-export-submit{background:#254abd;border-color:#254abd;color:#fff}
#tracker-export-submit:disabled{opacity:.55;cursor:wait}
</style>

  if(!navigator.onLine)return Promise.reject(Error('Ekspor memerlukan internet. Sambungkan koneksi lalu coba lagi.'));
  const config=trackerExportConnection_();
  if(window.trackerNetlify_&&trackerTransport_)return trackerTransport_.call(config.endpoint,'portal',method,args);
  if(window.google?.script?.run)return new Promise((resolve,reject)=>{
    const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(()=>reject(Error('Ekspor belum dapat diproses. Periksa koneksi lalu coba lagi.')));
    if(typeof runner[method]!=='function'){reject(Error('Versi project portal belum sesuai. Perbarui Code.gs dan HTML portal, lalu Deploy New version.'));return;}
    runner[method](...args);
  });

}
function trackerPackageCurrent_(attempt){
  if(attempt!==trackerExportAttempt_||!trackerExportBusy_){const e=Error('Ekspor dibatalkan.');e.code='CANCELLED';throw e;}
}
